name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public client configuration
        run: node scripts/check-client-env.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LINE_AUTH_PROVIDER: ${{ vars.VITE_LINE_AUTH_PROVIDER }}
          QUIZMAKE_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.QUIZMAKE_EXPECTED_SUPABASE_PROJECT_REF }}

      # Keep validation scoped to the affected areas of this release.
      - name: Test sync inheritance and recovery
        run: >-
          node --import ./tests/helpers/typescript-imports.mjs --test --test-concurrency=2 --test-timeout=60000
          tests/backup-retention.test.mjs tests/note-loading.test.mjs tests/note-record-migration.test.mjs
          tests/blob-vault.test.mjs tests/blob-archive-migration.test.mjs tests/blob-complete-backup.test.mjs
          tests/delta-sync-local.test.mjs tests/delta-sync-sql.test.mjs
          tests/storage-ledger.test.mjs tests/storage-breakdown.test.mjs tests/storage-provenance.test.mjs
          tests/app-record-storage.test.mjs tests/account-union-source.test.mjs tests/account-storage.test.mjs
          tests/record-sync-network.test.mjs tests/record-sync-opt-in.test.mjs
          tests/sync-attempt-status.test.mjs
          tests/question-image-records.test.mjs tests/question-image-copy.test.mjs
          tests/complete-backup.test.mjs tests/whole-sync-sql.test.mjs
          tests/public-import.test.mjs tests/publication-materials.test.mjs
          tests/reference-link-manual.test.mjs
          tests/companion-animation.test.mjs tests/companion-care.test.mjs tests/companion-care-storage.test.mjs tests/study-companion.test.mjs
          tests/problem-set-creation.test.mjs tests/note-exit-flush.test.mjs tests/material-reference-integrity.test.mjs

      - name: Build
        run: npm run build
        env:
          VITE_WHOLE_SYNC_ENABLED: 'true'
          VITE_DELTA_SYNC_ENABLED: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LINE_AUTH_PROVIDER: ${{ vars.VITE_LINE_AUTH_PROVIDER }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
